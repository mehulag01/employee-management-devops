services:
  postgres:
    image: postgres:16-alpine
    container_name: employee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: employees
      POSTGRES_USER: employees
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisLocalPassword123!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employees -d employees"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: employee-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_USER: employees
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisLocalPassword123!}
      DB_NAME: employees
      DB_PORT: "5432"
      ALLOWED_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: employee-frontend
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - backend

volumes:
  postgres_data:
